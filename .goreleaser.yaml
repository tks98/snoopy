version: 2

project_name: snoopy

# snoopy's Java agent (--java), built with a JDK 21 or later into
# java/out, reproducibly for a given JDK (java/build.sh; the release
# workflow pins its JDK). Not something `go install` or a plain go build
# needs.
before:
  hooks:
    - sh java/build.sh

builds:
  - id: snoopy
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # The binaries' times are the commit's, as is everything in the
    # archives, so the same commit builds the same archives.
    mod_timestamp: "{{ .CommitTimestamp }}"
  # The kubectl plugin, a module of its own, which runs where kubectl does.
  - id: kubectl-snoopy
    dir: cmd/kubectl-snoopy
    binary: kubectl-snoopy
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # The binaries' times are the commit's, as is everything in the
    # archives, so the same commit builds the same archives.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: snoopy
    ids: [snoopy]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info: &binary
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &file
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info: *file
      # Next to snoopy, where --java looks for them.
      - src: java/out/snoopy-*.jar
        strip_parent: true
        info: *file
  # krew wants the license in the archive.
  - id: kubectl-snoopy
    ids: [kubectl-snoopy]
    formats: [tar.gz]
    name_template: "kubectl-snoopy_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info: *binary
    files:
      - src: LICENSE
        info: *file

# An SBOM (SPDX JSON, by syft) for each archive, released next to it.
sboms:
  - artifacts: archive

# checksums.txt covers everything released: the archives, their SBOMs, the
# jars and the krew manifest. The release workflow attests it.
checksum:
  name_template: checksums.txt
  extra_files:
    - glob: java/out/snoopy-*.jar
    # The krew pipe writes it after the checksums are first made; they're
    # made again when the release is published, and then it's there. (A
    # pattern, not a path, so that it may match nothing the first time.)
    - glob: dist/krew/*.yaml
      name_template: krew-snoopy.yaml

# The agent's jars on their own too, for a snoopy from go install or a
# package without them; and the krew manifest, for krew-index, which it's
# submitted to by hand (docs/kubernetes.md).
release:
  extra_files:
    - glob: java/out/snoopy-*.jar
    - glob: dist/krew/*.yaml
      name_template: krew-snoopy.yaml

changelog:
  sort: asc

# A multi-arch image with the static binary and the Java agent's jars, at
# ghcr.io/tks98/snoopy.
# It needs the host's PID namespace and privileges to trace anything; see
# docs/usage.md, "Containers and Kubernetes".
dockers_v2:
  - ids: [snoopy]
    images:
      - ghcr.io/tks98/snoopy
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - java/out/snoopy-agent.jar
      - java/out/snoopy-hooks.jar
    labels:
      org.opencontainers.image.title: snoopy
      org.opencontainers.image.description: See what Linux programs send over TLS, with eBPF
      org.opencontainers.image.source: https://github.com/tks98/snoopy
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: MIT
    annotations:
      manifest:org.opencontainers.image.description: See what Linux programs send over TLS, with eBPF
      manifest:org.opencontainers.image.source: https://github.com/tks98/snoopy
      manifest:org.opencontainers.image.licenses: MIT

# The krew manifest, kept in dist/ and attached to the release as
# krew-snoopy.yaml (release.extra_files), not pushed to krew-index:
# submitting it there is done by hand (docs/kubernetes.md).
krews:
  - name: snoopy
    ids: [kubectl-snoopy]
    homepage: https://github.com/tks98/snoopy
    short_description: Show what a pod sends and receives over TLS
    description: |
      Shows what a pod's containers send and receive over TLS, decoded
      (HTTP/1.1, HTTP/2, HTTP/3, gRPC), without certificates or changes to
      the pod. It runs snoopy, an eBPF tracer, on the pod's node in a
      privileged pod of its own that shares the node's PID namespace,
      attaches to it, and deletes it when you stop.
    caveats: |
      The snoopy pod is privileged and shares the node's PID namespace, so
      it needs a namespace whose Pod Security level allows that, and
      permission to create pods there and attach to them. Nodes need Linux
      5.10 or later.

      Its output contains whatever the pod sends, passwords and tokens
      included.
    skip_upload: true
