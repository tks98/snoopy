# The demo app docs/demo/record-kubectl.sh records kubectl snoopy on: a
# checkout deployment that posts charges, with a made-up API key, to a
# payments service over HTTPS, inside the cluster. Everything in it is made
# up, and nothing leaves the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments
  namespace: shop
data:
  server.py: |
    import http.server, json, random, ssl

    class Handler(http.server.BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def do_POST(self):
            charge = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))) or "{}")
            body = json.dumps({"id": "ch_%06d" % random.randrange(10**6), "status": "succeeded",
                               "amount": charge.get("amount"), "currency": charge.get("currency")}).encode()
            self.send_response(201)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass

    ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
    ctx.load_cert_chain("/certs/cert.pem", "/certs/key.pem")
    server = http.server.ThreadingHTTPServer(("", 8443), Handler)
    server.socket = ctx.wrap_socket(server.socket, server_side=True)
    server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: shop
spec:
  selector:
    matchLabels: {app: payments}
  template:
    metadata:
      labels: {app: payments}
    spec:
      initContainers:
        - name: cert
          image: alpine/openssl
          args: [req, -x509, -newkey, ec, -pkeyopt, "ec_paramgen_curve:P-256", -nodes, -days, "30",
                 -subj, /CN=payments, -keyout, /certs/key.pem, -out, /certs/cert.pem]
          volumeMounts: [{name: certs, mountPath: /certs}]
      containers:
        - name: server
          image: python:3.13-alpine
          command: [python, /app/server.py]
          ports: [{containerPort: 8443}]
          volumeMounts:
            - {name: certs, mountPath: /certs}
            - {name: app, mountPath: /app}
      volumes:
        - {name: certs, emptyDir: {}}
        - {name: app, configMap: {name: payments}}
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: shop
spec:
  selector: {app: payments}
  ports: [{port: 8443}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      containers:
        - name: app
          image: curlimages/curl
          command:
            - sh
            - -c
            - |
              while true; do
                curl -s -k -o /dev/null https://payments.shop.svc:8443/v1/charges \
                  -H "Authorization: Bearer demo-key-not-a-real-secret" \
                  -H "Content-Type: application/json" \
                  -d "{\"amount\":$((RANDOM % 9000 + 1000)),\"currency\":\"usd\",\"customer\":\"cus_demo42\"}"
                sleep 1.5
              done
