[package]
name = "rustlsasync"
version = "0.1.0"
edition = "2021"
publish = false

# rustls under tokio, where the plaintext is seen where its crypto provider
# encrypts and decrypts records: rustls's default, aws-lc-rs, or ring with
# --no-default-features --features ring.
[features]
default = ["aws-lc"]
aws-lc = ["rustls/aws_lc_rs"]
ring = ["rustls/ring"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }

[profile.release]
debug = false
