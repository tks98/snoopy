name: Load check

# Loads every BPF program under the verifiers of the oldest kernels snoopy
# supports, in QEMU, on x86-64 and arm64, when the BPF code or how it's
# loaded changes. CI's own runners only have recent kernels, and 5.10's
# verifier is the strictest.
on:
  pull_request:
    paths:
      - bpf/**
      - internal/tracer/**
      - tools/loadcheck/**
      - .github/workflows/loadcheck.yml
  push:
    branches: [main]
    paths:
      - bpf/**
      - internal/tracer/**
      - tools/loadcheck/**
  workflow_dispatch:

# Each job asks for what it needs.
permissions: {}

jobs:
  loadcheck:
    name: BPF loads on 5.10 to 6.12 (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The arm64 runners have no KVM: QEMU emulates there, which takes
      # about half a minute a kernel.
      - name: Install QEMU, and let it use KVM if there is one
        run: |
          sudo apt-get update
          case $(uname -m) in
          x86_64) sudo apt-get install -y qemu-system-x86 cpio ;;
          aarch64) sudo apt-get install -y qemu-system-arm cpio ;;
          esac
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - run: tools/loadcheck/fetch.sh 5.10 5.15 6.1 6.6 6.12
      - run: tools/loadcheck/run.sh
