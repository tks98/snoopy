name: CI

# On pull requests, and on main once merged; not on every branch push too,
# which ran everything twice for a pull request's commits. Docs alone don't
# need it.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# Each job asks for what it needs.
permissions: {}

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./... && go vet -tags integration ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - run: go test -race ./...
      # Known vulnerabilities reachable from the code, in the toolchain
      # (go.mod's toolchain line) or a dependency.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build for amd64 and arm64
        run: |
          CGO_ENABLED=0 GOARCH=amd64 go build -o /dev/null .
          CGO_ENABLED=0 GOARCH=arm64 go build -o /dev/null .

  generate:
    name: BPF objects are up to date
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18
      # The committed objects were built with clang 18; other versions
      # produce different (but equivalent) bytes.
      - run: go generate ./...
        env:
          BPF2GO_CC: clang-18
          BPF2GO_STRIP: llvm-strip-18
      - name: Check for differences
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated BPF code is stale; run 'make generate' with clang 18 and commit the result."
            exit 1
          fi

  integration:
    name: Integration tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install TLS clients
        run: sudo apt-get update && sudo apt-get install -y curl python3 gnutls-bin libnss3-dev libwolfssl-dev libmbedtls-dev libssl-dev cmake pkg-config
      # Ubuntu (and Debian) don't package s2n-tls, so TestS2N gets a release
      # built from source, into /usr/local. It takes seconds.
      - name: Build s2n-tls
        run: |
          v=1.7.12
          curl -fsSLo s2n.tar.gz "https://github.com/aws/s2n-tls/archive/refs/tags/v$v.tar.gz"
          echo "76d3e6125ad8f7d960a62bf1e18c451fb75ed6ab640247b046b5b0f55d39d099  s2n.tar.gz" | sha256sum -c -
          tar xzf s2n.tar.gz
          cmake -S "s2n-tls-$v" -B "$RUNNER_TEMP/s2n" -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s2n" -j "$(nproc)"
          sudo cmake --install "$RUNNER_TEMP/s2n" && sudo ldconfig
          rm -rf s2n.tar.gz "s2n-tls-$v"
      - run: go test -c -tags integration -o internal/tracer/tracer.test ./internal/tracer
      - name: Run (as root)
        working-directory: internal/tracer
        # TestJSSE has a job of its own, for each JDK, and the rustls and
        # quinn tests a weekly workflow (rust.yml). SNOOPY_TEST_STRICT: a
        # client or library missing here fails its test rather than skipping
        # it.
        run: sudo env SNOOPY_TEST_STRICT=1 ./tracer.test -test.v -test.timeout 5m -test.skip TestJSSE
      # --quiet: the runner's own TLS traffic, including its credentials,
      # must not end up in the (public) log.
      - name: Smoke-test the binary
        run: |
          go build -o snoopy .
          ./snoopy --version
          sudo timeout -s INT 5 ./snoopy --no-scan --quiet || [ $? -eq 124 ]

  java:
    name: Java agent (JDK ${{ matrix.jdk }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        jdk: [17, 21, 25]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - run: go test -c -tags integration -o internal/tracer/tracer.test ./internal/tracer
      # For TestJSSE's "user namespace" case, whose unshare maps root to
      # nobody with newuidmap, which only maps the IDs these allow.
      - name: Let root map nobody's IDs
        run: |
          echo root:65534:1 | sudo tee -a /etc/subuid
          echo root:65534:1 | sudo tee -a /etc/subgid
      - name: Run TestJSSE (as root)
        working-directory: internal/tracer
        # With PATH, which sudo would reset, for setup-java's JDK; and
        # SNOOPY_TEST_JAVA, so that it fails rather than skips without one.
        run: sudo env PATH="$PATH" SNOOPY_TEST_JAVA=1 SNOOPY_TEST_STRICT=1 ./tracer.test -test.v -test.timeout 5m -test.run TestJSSE
