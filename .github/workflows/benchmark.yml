name: Benchmark

# Runs docs/benchmark/run.sh and java.sh on GitHub's x86-64 and arm64
# runners, to see what snoopy costs on machines other than a developer's VM,
# and to catch a change that makes it slower. Its output goes in the job
# summary. Runners are shared VMs, so compare numbers within a run, not
# across runs. By hand only (Actions, Benchmark, Run workflow): it takes a
# while, and the scripts run anywhere.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install wrk, nginx and bpftool
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk nginx
          sudo systemctl stop nginx
          # bpftool adds each BPF program's average time. The runners'
          # tools packages have none, so libbpf's static build, checked.
          case $(uname -m) in
          x86_64) arch=amd64 sum=09150596f09356b0ff632dd7f9856e0ea86bf96b269e9bc94278d9a9432a268c ;;
          aarch64) arch=arm64 sum=d68443d945c146080151eb215bebaa400294ab7ada22af4f5d0a940f5992b9d9 ;;
          esac
          f=bpftool-v7.7.0-$arch.tar.gz
          curl -fsSLO "https://github.com/libbpf/bpftool/releases/download/v7.7.0/$f"
          echo "$sum  $f" | sha256sum -c -
          tar xzf "$f" && sudo install bpftool /usr/local/bin/bpftool && rm -f bpftool "$f"
          bpftool version
      - name: Build snoopy
        run: CGO_ENABLED=0 go build -o snoopy . && sudo install snoopy /usr/local/bin/snoopy
      - name: Run
        # Only the servers' own traffic, to themselves, so nothing private.
        run: |
          sudo env "PATH=$PATH" docs/benchmark/run.sh 10 | tee benchmark.txt
          { echo '```'; cat benchmark.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Run for Java (--java)
        # The JDK's own HTTPS server, under the same load.
        run: |
          sudo env "PATH=$PATH" docs/benchmark/java.sh 10 | tee benchmark-java.txt
          { echo '```'; cat benchmark-java.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
